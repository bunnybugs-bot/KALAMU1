# Configuration de l'espace d'administration (Decap CMS)
# L'administrateur se connecte sur /admin avec son e-mail et son mot de passe.
# Chaque élément (événement, livre, membre) est un fichier dans content/.
# À chaque « Publier », Netlify reconstruit data/ (scripts/build-data.js) et le site se met à jour en 1 à 2 minutes.

backend:
  name: git-gateway
  branch: main
  commit_messages:
    create: "Admin : ajout de « {{slug}} » ({{collection}})"
    update: "Admin : modification de « {{slug}} » ({{collection}})"
    delete: "Admin : suppression de « {{slug}} » ({{collection}})"
    uploadMedia: "Admin : ajout de l'image {{path}}"
    deleteMedia: "Admin : suppression de l'image {{path}}"

locale: fr
site_url: https://kalamu-association.netlify.app
display_url: https://kalamu-association.netlify.app
logo_url: /logo.PNG

# Les images envoyées depuis l'admin sont rangées ici
media_folder: images/uploads
public_folder: /images/uploads

slug:
  encoding: ascii
  clean_accents: true

collections:
  # ---------------------------------------------------------------- Événements
  - name: evenements
    label: Événements
    label_singular: Événement
    description: "Chaque fiche est un événement. Il apparaît « à l'affiche » sur la page Événements et disparaît tout seul quand sa date est dépassée."
    folder: content/evenements
    format: json
    extension: json
    create: true
    delete: true
    slug: "{{fields.date_debut}}-{{slug}}"
    identifier_field: titre
    summary: "{{titre}} — {{date_debut | date('DD/MM/YYYY')}}"
    sortable_fields:
      - field: date_debut
        label: Date
        default_sort: desc
      - field: titre
        label: Titre
    view_groups:
      - label: Année
        field: date_debut
        pattern: \d{4}
    editor:
      preview: false
    fields:
      - { name: titre, label: Titre, widget: string }
      - name: date_debut
        label: Date (ou date de début)
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "DD/MM/YYYY"
        time_format: false
        picker_utc: true
      - name: date_fin
        label: Date de fin
        hint: "Seulement si l'événement dure plusieurs jours. Sinon, laissez vide."
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "DD/MM/YYYY"
        time_format: false
        picker_utc: true
        required: false
      - { name: lieu, label: Lieu, widget: string, required: false }
      - { name: description, label: Description, widget: text }
      - { name: image, label: Affiche ou photo, widget: image, required: false, choose_url: false }
      - name: tags
        label: Mots-clés
        hint: "Séparez les mots-clés par des virgules (ex. : Concours, Kaolack)."
        widget: list
        required: false
        default: []

  # ---------------------------------------------------------------- Bibliothèque
  - name: livres
    label: Bibliothèque
    label_singular: Livre
    description: "Chaque carte est un livre de la page Bibliothèque."
    folder: content/livres
    format: json
    extension: json
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: titre
    summary: "{{titre}}"
    sortable_fields:
      - field: titre
        label: Titre
      - field: auteur
        label: Auteur
      - field: ordre
        label: Ordre d'affichage
        default_sort: asc
    view_groups:
      - label: Catégorie
        field: categorie
    view_filters:
      - { label: "Sur la page d'accueil", field: accueil, pattern: true }
      - { label: "Dans le carrousel", field: carrousel, pattern: true }
      - { label: "À paraître", field: a_paraitre, pattern: true }
    editor:
      preview: false
    fields:
      - { name: titre, label: Titre, widget: string }
      - { name: auteur, label: Auteur, widget: string, required: false }
      - name: categorie
        label: Catégorie
        widget: select
        default: contemporains
        options:
          - { label: "Publications Kalamu", value: kalamu }
          - { label: "Classiques", value: classiques }
          - { label: "Contemporains", value: contemporains }
          - { label: "Poésie", value: poesie }
          - { label: "Essais et société", value: essais }
          - { label: "Littérature du monde", value: monde }
          - { label: "Jeunesse", value: jeunesse }
      - { name: cover, label: Couverture, widget: image, required: false, choose_url: false }
      - name: resume_court
        label: Résumé court
        hint: "Une ou deux phrases, affichées directement."
        widget: text
        required: false
      - name: resume
        label: Suite du résumé
        hint: "Facultatif : affichée quand le visiteur clique sur « Lire plus »."
        widget: text
        required: false
      - name: genre
        label: Genre
        hint: "Un mot affiché en étiquette (ex. : Poésie, Contes, BD)."
        widget: string
        required: false
      - { name: annee, label: "Année de publication", widget: string, required: false }
      - { name: editeur, label: "Maison d'édition", widget: string, required: false }
      - name: exemplaires
        label: "Nombre d'exemplaires"
        hint: "Combien d'exemplaires l'association possède."
        widget: number
        value_type: int
        min: 1
        default: 1
        required: false
      - { name: a_paraitre, label: "Livre à paraître", widget: boolean, default: false }
      - name: accueil
        label: "Afficher sur la page d'accueil"
        hint: "Les 4 premiers livres cochés (selon l'ordre d'affichage) apparaissent sur l'accueil."
        widget: boolean
        default: false
      - { name: carrousel, label: "Afficher dans le grand carrousel de la bibliothèque", widget: boolean, default: false }
      - name: accroche
        label: Phrase du carrousel
        hint: "Courte phrase affichée sur l'image du carrousel."
        widget: string
        required: false
      - name: ordre
        label: Ordre d'affichage
        hint: "Plus le nombre est petit, plus le livre apparaît tôt (ex. : 10, 20, 30…)."
        widget: number
        value_type: int
        default: 100

  # ---------------------------------------------------------------- Souvenirs
  - name: souvenirs
    label: Souvenirs (photos)
    label_singular: Photo
    description: "Photos des événements passés, affichées en album sur la page Événements. La rubrique reste masquée tant qu'il n'y a aucune photo."
    folder: content/souvenirs
    format: json
    extension: json
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: legende
    summary: "{{legende}}"
    sortable_fields:
      - field: ordre
        label: Ordre d'affichage
        default_sort: asc
    editor:
      preview: false
    fields:
      - { name: image, label: Photo, widget: image, choose_url: false }
      - { name: legende, label: Légende, hint: "Quelques mots affichés sous la photo.", widget: string }
      - { name: evenement, label: Événement, hint: "Facultatif : ex. Mini Foire du Livre, mai 2026.", widget: string, required: false }
      - name: ordre
        label: Ordre d'affichage
        hint: "Plus le nombre est petit, plus la photo apparaît tôt (10, 20, 30…)."
        widget: number
        value_type: int
        default: 100

  # ---------------------------------------------------------------- Membres
  - name: membres
    label: Membres
    label_singular: Membre
    description: "Les membres du bureau. Leurs fiches ne s'affichent que si l'option est cochée dans Paramètres › Bureau exécutif."
    folder: content/membres
    format: json
    extension: json
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: nom
    summary: "{{nom}} — {{role}}"
    sortable_fields:
      - field: ordre
        label: Ordre d'affichage
        default_sort: asc
      - field: nom
        label: Nom
    editor:
      preview: false
    fields:
      - { name: nom, label: Nom, widget: string }
      - { name: role, label: Rôle, widget: string }
      - name: pole
        label: Pôle
        hint: "Détermine la rubrique où la personne apparaît sur la page Équipe."
        widget: select
        default: direction
        options:
          - { label: "Direction", value: direction }
          - { label: "Vie associative", value: vie-associative }
          - { label: "Pédagogie & documentation", value: pedagogie }
          - { label: "Communication & médias", value: communication }
          - { label: "Pôle Social & Enfant", value: social }
          - { label: "Pôle Inclusion & Leadership", value: inclusion }
          - { label: "Kalamu Éco-Plume", value: eco-plume }
      - { name: photo, label: Photo, widget: image, required: false, choose_url: false }
      - { name: bio, label: Présentation, widget: text, required: false }
      - name: ordre
        label: Ordre d'affichage
        hint: "Plus le nombre est petit, plus le membre apparaît tôt."
        widget: number
        value_type: int
        default: 100

  # ---------------------------------------------------------------- Partenaires
  - name: partenaires
    label: Partenaires
    label_singular: Partenaire
    description: "Les partenaires de l'association. Ils apparaissent dans « Ils font équipe avec nous » sur la page Équipe (la rubrique reste masquée tant qu'il n'y en a aucun)."
    folder: content/partenaires
    format: json
    extension: json
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: nom
    summary: "{{nom}}"
    sortable_fields:
      - field: ordre
        label: Ordre d'affichage
        default_sort: asc
      - field: nom
        label: Nom
    editor:
      preview: false
    fields:
      - { name: nom, label: Nom du partenaire, widget: string }
      - name: type
        label: Type
        widget: select
        default: culture
        options:
          - { label: "Éducation", value: education }
          - { label: "Culture", value: culture }
          - { label: "ONG", value: ong }
          - { label: "Institutions", value: institutions }
          - { label: "Médias", value: medias }
      - { name: logo, label: Logo, widget: image, required: false, choose_url: false }
      - name: lien
        label: Site web
        hint: "Facultatif : adresse complète commençant par https://"
        widget: string
        required: false
      - name: ordre
        label: Ordre d'affichage
        hint: "Plus le nombre est petit, plus le partenaire apparaît tôt (10, 20, 30…)."
        widget: number
        value_type: int
        default: 100

  # ---------------------------------------------------------------- Paramètres
  - name: parametres
    label: Paramètres
    description: "Coordonnées, chiffres clés et photo du bureau exécutif."
    editor:
      preview: false
    files:
      - name: infos
        label: Coordonnées et réseaux sociaux
        file: content/infos.json
        fields:
          - { name: adresse, label: Adresse, widget: string }
          - name: telephones
            label: Téléphones
            label_singular: numéro
            widget: list
            field: { name: numero, label: Numéro, widget: string }
          - { name: email, label: E-mail, widget: string }
          - { name: facebook, label: Lien Facebook, widget: string, required: false }
          - { name: instagram, label: Lien Instagram, widget: string, required: false }
          - { name: tiktok, label: Lien TikTok, widget: string, required: false }
      - name: chiffres
        label: Chiffres clés
        file: content/chiffres.json
        fields:
          - { name: titre, label: Titre du bloc, widget: string }
          - { name: periode, label: Période, widget: string, hint: "Ex. : Mai 2025 – septembre 2026" }
          - name: chiffres
            label: Chiffres
            label_singular: chiffre
            hint: "Le premier chiffre est aussi affiché dans la carte en bas à gauche de la page d'accueil."
            widget: list
            summary: "{{fields.valeur}} {{fields.libelle}}"
            fields:
              - { name: valeur, label: Valeur, widget: string, hint: "Ex. : 200+" }
              - { name: libelle, label: Texte, widget: string, hint: "Ex. : livres dans notre Bibliothèque Nomade" }
      - name: bureau
        label: Bureau exécutif
        file: content/bureau.json
        fields:
          - { name: photo_groupe, label: Photo de groupe du bureau, widget: image, required: false, choose_url: false }
          - name: afficher_fiches
            label: "Afficher aussi la fiche de chaque membre"
            hint: "Si décoché, seule la photo de groupe est affichée sur le site."
            widget: boolean
            default: false
