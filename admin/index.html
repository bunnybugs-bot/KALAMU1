<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Administration - Association Kalamu</title>
    <link rel="icon" type="image/png" href="/logo.PNG">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/admin/admin.css">
    <script>
        // Affichage en cartes (avec images) par défaut ; l'admin peut repasser en liste avec les boutons en haut à droite
        try {
            if (!localStorage.getItem('decap-cms.entries.viewStyle')) {
                localStorage.setItem('decap-cms.entries.viewStyle', 'VIEW_STYLE_GRID');
            }
        } catch (e) { /* stockage indisponible : affichage par défaut */ }
    </script>
    <!-- Connexion des administrateurs (Netlify Identity) -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
    <!-- Interface d'administration (Decap CMS), configurée dans admin/config.yml -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
